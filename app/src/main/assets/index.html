<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>双色球缩水 V3.4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0f14;color:#e8eaed;font-family:sans-serif;font-size:14px;-webkit-tap-highlight-color:rgba(0,0,0,0)}
body{padding-bottom:76px}
.hd{position:sticky;top:0;z-index:50;background:#0b0f14;border-bottom:1px solid #2a3444;padding:12px;display:flex;justify-content:space-between;align-items:center}
.hd h1{font-size:17px;color:#e0a458}
.hd span{font-size:11px;color:#9aa3b2}
.sec{margin:10px;background:#151b24;border:1px solid #2a3444;border-radius:10px}
.sh{padding:10px 12px;background:#1c2430;border-bottom:1px solid #2a3444;font-weight:600}
.sb{padding:10px 12px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.btn{background:#1c2430;border:1px solid #2a3444;color:#e8eaed;border-radius:8px;padding:10px 14px;font-size:14px;min-height:44px}
.btn.on{border-color:#e0a458;color:#e0a458}
.btn.pri{background:#e0a458;border:none;color:#1a1208;font-weight:700;font-size:16px}
.btn.ok{border-color:#3dd68c;color:#3dd68c}
.pad{display:flex;flex-wrap:wrap;gap:6px}
.ball{width:28px;height:28px;border-radius:50%;border:1px solid #2a3444;background:#0b0f14;color:#e8eaed;font-size:12px;text-align:center;line-height:28px}
.ball.on{background:#e85d5d;border-color:#e85d5d;color:#fff;font-weight:700}
.ball.blu.on{background:#4a9eff;border-color:#4a9eff}
.ball.kill{background:#3a2020;border-color:#e85d5d;color:#e85d5d;text-decoration:line-through}
.ball.dan{background:#1a3a2a;border-color:#3dd68c;color:#3dd68c;font-weight:700}
.hint{font-size:12px;color:#9aa3b2;margin-top:6px}
.ft{position:fixed;bottom:0;left:0;right:0;background:#0b0f14;border-top:1px solid #2a3444;padding:10px;z-index:50}
.ft .btn{width:100%}
.log{font-size:12px;max-height:140px;overflow:auto;background:#0b0f14;padding:8px;border:1px solid #2a3444;border-radius:6px;margin-top:8px;white-space:pre-wrap}
input[type=number]{width:56px;background:#0b0f14;border:1px solid #2a3444;color:#e8eaed;border-radius:6px;padding:8px;font-size:14px}
label{font-size:13px;color:#9aa3b2;margin-right:4px}
</style>
</head>
<body>
<div class="hd">
  <div><h1>双色球缩水 V3.4</h1><span>只缩减注数 · 不预测</span></div>
  <button class="btn" type="button" id="btnReset">重置</button>
</div>

<div class="sec">
  <div class="sh">红球 · 候选/杀号/胆码</div>
  <div class="sb">
    <div class="row">
      <button class="btn on" type="button" id="mPool">候选</button>
      <button class="btn" type="button" id="mKill">杀号</button>
      <button class="btn" type="button" id="mDan">胆码</button>
      <button class="btn" type="button" id="clrRed">清空</button>
    </div>
    <div class="pad" id="redPad"></div>
    <div class="hint" id="redHint">点号码切换</div>
  </div>
</div>

<div class="sec">
  <div class="sh">蓝球</div>
  <div class="sb"><div class="pad" id="bluePad"></div></div>
</div>

<div class="sec">
  <div class="sh">条件（勾选启用）</div>
  <div class="sb">
    <div class="row"><label><input type="checkbox" id="enSum" checked>和值</label>
      <input type="number" id="sumMin" value="60">~<input type="number" id="sumMax" value="140"></div>
    <div class="row"><label><input type="checkbox" id="enSpan" checked>跨度</label>
      <input type="number" id="spanMin" value="10">~<input type="number" id="spanMax" value="32"></div>
    <div class="row"><label><input type="checkbox" id="enOdd" checked>奇数个</label>
      <input type="number" id="oddMin" value="1">~<input type="number" id="oddMax" value="5"></div>
    <div class="row"><label><input type="checkbox" id="enBig" checked>大号个</label>
      <input type="number" id="bigMin" value="1">~<input type="number" id="bigMax" value="5"></div>
  </div>
</div>

<div class="sec">
  <div class="sh">多轮投注集</div>
  <div class="sb">
    <div class="row">
      <button class="btn ok" type="button" id="btnUse">用本轮投注集</button>
      <button class="btn" type="button" id="btnClrSt">清空轮次</button>
    </div>
    <div class="log" id="stageLog">暂无轮次</div>
  </div>
</div>

<div class="sec">
  <div class="sh">结果</div>
  <div class="sb">
    <div class="hint" id="sum">尚未过滤</div>
    <div class="log" id="list"></div>
  </div>
</div>

<div class="ft">
  <button class="btn pri" type="button" id="btnRun">开始过滤</button>
</div>

<script>
var mode='pool';
var reds={},kills={},dans={},blues={};
var last=[],stages=[],useCombos=false;
var MAX=25000;

function $(id){return document.getElementById(id)}
function n2(n){return n<10?'0'+n:''+n}
function has(o,n){return o[n]===1}
function toggle(o,n){if(o[n])delete o[n];else o[n]=1}
function keys(o){var a=[];for(var k in o)if(o.hasOwnProperty(k))a.push(+k);return a.sort(function(x,y){return x-y})}
function count(o){var c=0;for(var k in o)if(o.hasOwnProperty(k))c++;return c}

function render(){
  var rp=$('redPad');rp.innerHTML='';
  for(var i=1;i<=33;i++){
    var d=document.createElement('div');
    d.className='ball';
    d.innerHTML=n2(i);
    d.setAttribute('data-n',i);
    if(has(kills,i))d.className+=' kill';
    else if(has(dans,i))d.className+=' dan';
    else if(has(reds,i))d.className+=' on';
    d.onclick=(function(nn){return function(){onRed(nn)}})(i);
    rp.appendChild(d);
  }
  var bp=$('bluePad');bp.innerHTML='';
  for(var i=1;i<=16;i++){
    var d=document.createElement('div');
    d.className='ball blu';
    d.innerHTML=n2(i);
    d.setAttribute('data-n',i);
    if(has(blues,i))d.className+=' on';
    d.onclick=(function(nn){return function(){onBlue(nn)}})(i);
    bp.appendChild(d);
  }
  $('redHint').innerHTML='候选'+count(reds)+' 杀号'+count(kills)+' 胆码'+count(dans)+(useCombos?' [投注集]':'');
}

function onRed(n){
  if(mode==='kill'){toggle(kills,n);delete reds[n];delete dans[n]}
  else if(mode==='dan'){toggle(dans,n);delete kills[n];delete reds[n]}
  else{toggle(reds,n);delete kills[n];delete dans[n]}
  render();
}
function onBlue(n){toggle(blues,n);render()}

function setMode(m){
  mode=m;
  $('mPool').className=m==='pool'?'btn on':'btn';
  $('mKill').className=m==='kill'?'btn on':'btn';
  $('mDan').className=m==='dan'?'btn on':'btn';
}

$('mPool').onclick=function(){setMode('pool')};
$('mKill').onclick=function(){setMode('kill')};
$('mDan').onclick=function(){setMode('dan')};
$('clrRed').onclick=function(){reds={};kills={};dans={};render()};
$('btnReset').onclick=function(){
  reds={};kills={};dans={};blues={};last=[];stages=[];useCombos=false;
  render();$('stageLog').innerHTML='暂无轮次';$('sum').innerHTML='尚未过滤';$('list').innerHTML='';
};

function comb(arr,k){
  var out=[];
  function rec(s,p){
    if(p.length===k){out.push(p.slice());return}
    for(var i=s;i<arr.length;i++){p.push(arr[i]);rec(i+1,p);p.pop()}
  }
  rec(0,[]);return out;
}

function okCombo(c){
  var sum=0,mn=99,mx=0,odd=0,big=0,i,x;
  for(i=0;i<6;i++){x=c[i];sum+=x;if(x<mn)mn=x;if(x>mx)mx=x;if(x%2)odd++;if(x>=17)big++}
  var span=mx-mn;
  if($('enSum').checked){var a=+$('sumMin').value,b=+$('sumMax').value;if(sum<a||sum>b)return false}
  if($('enSpan').checked){var a=+$('spanMin').value,b=+$('spanMax').value;if(span<a||span>b)return false}
  if($('enOdd').checked){var a=+$('oddMin').value,b=+$('oddMax').value;if(odd<a||odd>b)return false}
  if($('enBig').checked){var a=+$('bigMin').value,b=+$('bigMax').value;if(big<a||big>b)return false}
  for(i=0;i<6;i++){if(has(kills,c[i]))return false}
  var dk=keys(dans);
  for(i=0;i<dk.length;i++){if(c.indexOf(dk[i])<0)return false}
  return true;
}

$('btnRun').onclick=function(){
  var pool=keys(reds);
  var src,inputN;
  if(useCombos&&last.length){src=last;inputN=src.length}
  else{
    if(pool.length<6){alert('请至少选6个候选红球');return}
    src=comb(pool,6);inputN=src.length;
  }
  var pass=[],i;
  for(i=0;i<src.length;i++){
    if(okCombo(src[i]))pass.push(src[i]);
    if(pass.length>=MAX)break;
  }
  last=pass;
  stages.push({inn:inputN,out:pass.length});
  var log='';
  for(i=0;i<stages.length;i++)log+='第'+(i+1)+'轮: 输入'+stages[i].inn+' → 通过'+stages[i].out+'\n';
  $('stageLog').innerHTML=log;
  $('sum').innerHTML='输入 '+inputN+' 注，通过 '+pass.length+' 注';
  var lines='';
  for(i=0;i<Math.min(pass.length,100);i++){
    var line='',j;
    for(j=0;j<6;j++){if(j)line+=' ';line+=n2(pass[i][j])}
    lines+=line+'\n';
  }
  if(pass.length>100)lines+='…共'+pass.length+'注';
  $('list').innerHTML=lines||'无通过';
};

$('btnUse').onclick=function(){
  if(!last.length){alert('请先过滤');return}
  useCombos=true;
  alert('已用本轮投注集，共'+last.length+'注');
  render();
};
$('btnClrSt').onclick=function(){stages=[];last=[];useCombos=false;$('stageLog').innerHTML='暂无轮次';render()};

render();
</script>
</body>
</html>
